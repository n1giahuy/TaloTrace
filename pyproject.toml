[project]
name = "chemistry-video-service"
version = "0.1.0"
description = "Phase 1 backend prototype for the Growtrics AI Chemistry Video Request Service challenge"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "google-adk==2.9.0",
  "google-genai==2.23.0",
  "google-cloud-storage>=3.3,<4.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
