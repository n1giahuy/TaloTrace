services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemistry-video-api
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/adc.json
    ports:
      - "8088:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./secrets/adc.json:/app/secrets/adc.json:ro
    restart: unless-stopped
